name: Auto Run Scheduler
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
env:
  TZ: Asia/Jakarta
  CONFIG_FILE: config/auto-run
jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo timedatectl set-timezone "${{ env.TZ }}"
          if [ ! -s "${{ env.CONFIG_FILE }}" ]; then exit 0; fi
          declare -a ACTIVE_BLOCKS
          IN_MAIN=false
          while IFS= read -r line || [ -n "$line" ]; do
            clean_line=$(echo "$line" | tr -d '\r' | xargs)
            if [[ "$clean_line" =~ ^main[[:space:]]*\[$ ]]; then IN_MAIN=true; continue; fi
            if [[ "$IN_MAIN" == true ]]; then
              if [[ "$clean_line" == "]" ]]; then break; fi
              if [[ -n "$clean_line" ]]; then ACTIVE_BLOCKS+=("$clean_line"); fi
            fi
          done < "${{ env.CONFIG_FILE }}"
          if [ ${#ACTIVE_BLOCKS[@]} -eq 0 ]; then exit 0; fi
          CURRENT_TS=$(date +%s)
          JOBS_EXECUTED=0
          declare -a PROCESSED_BLOCKS
          for MAIN_LINE in "${ACTIVE_BLOCKS[@]}"; do
            TARGET_BLOCK=$(echo "$MAIN_LINE" | awk '{print $1}')
            SCHEDULE_TIME=$(echo "$MAIN_LINE" | awk '{print $2" "$3}')
            IN_TARGET_BLOCK=false
            declare -a TARGETS
            TARGETS=()
            while IFS= read -r line || [ -n "$line" ]; do
              clean_line=$(echo "$line" | tr -d '\r' | xargs)
              if [[ "$clean_line" == "${TARGET_BLOCK} ["* ]]; then IN_TARGET_BLOCK=true; continue; fi
              if [[ "$IN_TARGET_BLOCK" == true ]]; then
                if [[ "$clean_line" =~ \]$ ]]; then
                  cmd_part=$(echo "${clean_line%]}" | xargs)
                  if [[ -n "$cmd_part" ]]; then TARGETS+=("$cmd_part"); fi
                  break
                fi
                if [[ -n "$clean_line" ]]; then TARGETS+=("$clean_line"); fi
              fi
            done < "${{ env.CONFIG_FILE }}"
            if [ -z "$SCHEDULE_TIME" ] || [ ${#TARGETS[@]} -eq 0 ]; then continue; fi
            IFS=' ' read -r TIME DATE <<< "$SCHEDULE_TIME"
            IFS='/' read -r DD MM YYYY <<< "$DATE"
            FORMATTED_DATE="$YYYY-$MM-$DD $TIME:00"
            SCHEDULE_TS=$(date -d "$FORMATTED_DATE" +%s)
            if [ "$CURRENT_TS" -ge "$SCHEDULE_TS" ]; then
              TOTAL_TARGETS=${#TARGETS[@]}
              CURRENT_JOB=0
              for target_line in "${TARGETS[@]}"; do
                CURRENT_JOB=$((CURRENT_JOB+1))
                IFS='-' read -r p1 p2 p3 <<< "$target_line"
                BRANCH=$(echo "$p1" | xargs)
                TARGET=$(echo "$p2" | xargs)
                TUNNEL=$(echo "$p3" | xargs)
                gh workflow run Builds.yml -f release_branch="$BRANCH" -f rootfs_size="1024" -f target="$TARGET" -f tunnel="$TUNNEL" -f clean="true"
                if [ "$CURRENT_JOB" -lt "$TOTAL_TARGETS" ]; then sleep 60; fi
              done
              JOBS_EXECUTED=$((JOBS_EXECUTED+1))
              PROCESSED_BLOCKS+=("$TARGET_BLOCK")
              sed -i "/^[[:space:]]*${TARGET_BLOCK}[[:space:]]*${TIME}.*$/d" "${{ env.CONFIG_FILE }}"
            fi
          done
          if [ "$JOBS_EXECUTED" -gt 0 ]; then
             for block in "${PROCESSED_BLOCKS[@]}"; do
               sed -i "/^${block}[[:space:]]*\[/,/\]/d" "${{ env.CONFIG_FILE }}"
             done
             sed -i '/^[[:space:]]*$/d' "${{ env.CONFIG_FILE }}"
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add "${{ env.CONFIG_FILE }}"
             git commit -m "Auto-cleanup execute trigger"
             git push
          fi
          gh run list --workflow "${{ github.workflow }}" --json databaseId -q '.[].databaseId' | tail -n +2 | xargs -I {} gh run delete {} || true
