name: Auto Run Scheduler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Jakarta
  CONFIG_FILE: config/auto-run

jobs:
  check-schedule:
    name: Check and Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Schedule and Trigger Builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo timedatectl set-timezone "${{ env.TZ }}"
          
          if [ ! -s "${{ env.CONFIG_FILE }}" ]; then
            echo "File antrean kosong."
            exit 0
          fi

          IN_BLOCK=false
          BLOCK_START=0
          BLOCK_END=0
          SCHEDULE_TIME=""
          declare -a TARGETS

          LINE_NUM=0
          while IFS= read -r line || [ -n "$line" ]; do
            LINE_NUM=$((LINE_NUM+1))
            clean_line=$(echo "$line" | tr -d '\r' | xargs)
            
            if [[ -z "$clean_line" ]] || [[ "$clean_line" =~ ^# ]]; then
              continue
            fi
            
            if [[ "$clean_line" =~ \[$ ]]; then
              IN_BLOCK=true
              BLOCK_START=$LINE_NUM
              continue
            fi
            
            if [[ "$IN_BLOCK" == true ]]; then
              if [[ "$clean_line" =~ \]$ ]]; then
                cmd_part=$(echo "${clean_line%]}" | xargs)
                if [[ -n "$cmd_part" ]]; then
                  if [ -z "$SCHEDULE_TIME" ]; then
                    SCHEDULE_TIME="$cmd_part"
                  else
                    TARGETS+=("$cmd_part")
                  fi
                fi
                BLOCK_END=$LINE_NUM
                break
              fi
              
              if [ -z "$SCHEDULE_TIME" ]; then
                SCHEDULE_TIME="$clean_line"
              else
                TARGETS+=("$clean_line")
              fi
            fi
          done < "${{ env.CONFIG_FILE }}"

          if [ "$BLOCK_START" -eq 0 ] || [ -z "$SCHEDULE_TIME" ]; then
            echo "Tidak ada blok aktif."
            exit 0
          fi

          if [[ ! "$SCHEDULE_TIME" =~ ^[0-9]{2}:[0-9]{2}\ [0-9]{2}/[0-9]{2}/[0-9]{4}$ ]]; then
            echo "Format jadwal salah."
            exit 0
          fi

          IFS=' ' read -r TIME DATE <<< "$SCHEDULE_TIME"
          IFS='/' read -r DD MM YYYY <<< "$DATE"
          FORMATTED_DATE="$YYYY-$MM-$DD $TIME:00"

          SCHEDULE_TS=$(date -d "$FORMATTED_DATE" +%s)
          CURRENT_TS=$(date +%s)

          echo "Jadwal: $FORMATTED_DATE | Saat Ini: $(date '+%Y-%m-%d %H:%M:%S')"

          if [ "$CURRENT_TS" -ge "$SCHEDULE_TS" ]; then
            echo "Eksekusi antrean..."
            
            TOTAL_TARGETS=${#TARGETS[@]}
            CURRENT_JOB=0
            
            for target_line in "${TARGETS[@]}"; do
              CURRENT_JOB=$((CURRENT_JOB+1))
              IFS='-' read -r p1 p2 p3 <<< "$target_line"
              BRANCH=$(echo "$p1" | xargs)
              TARGET=$(echo "$p2" | xargs)
              TUNNEL=$(echo "$p3" | xargs)
              
              echo "Run [$CURRENT_JOB/$TOTAL_TARGETS] -> Branch: $BRANCH | Target: $TARGET | Tunnel: $TUNNEL"
              
              gh workflow run Builds.yml \
                -f release_branch="$BRANCH" \
                -f rootfs_size="1024" \
                -f target="$TARGET" \
                -f tunnel="$TUNNEL" \
                -f clean="true"
                
              # Berikan jeda 60 detik jika ini bukan job terakhir di dalam blok
              if [ "$CURRENT_JOB" -lt "$TOTAL_TARGETS" ]; then
                echo "Menunggu 60 detik sebelum pemicuan berikutnya..."
                sleep 60
              fi
            done
            
            sed -i "${BLOCK_START},${BLOCK_END}d" "${{ env.CONFIG_FILE }}"
            sed -i '/^[[:space:]]*$/d' "${{ env.CONFIG_FILE }}"

            echo "Auto-commit..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${{ env.CONFIG_FILE }}"
            git commit -m "Auto-cleanup: Blok $(date '+%d-%m-%Y %H:%M')"
            git push
          else
            echo "Menunggu waktu eksekusi."
          fi
